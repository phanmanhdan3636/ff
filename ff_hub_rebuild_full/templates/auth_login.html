{% extends "base.html" %}
{% block content %}
<section class="card auth-card">
  <h1>Đăng nhập</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Tên đăng nhập</label><input name="username" placeholder="vd:freefire">
    <label>Mật khẩu</label><input name="password" type="password" placeholder="Vd:123123">
    <button class="btn primary" type="submit">Đăng nhập</button>
  </form>
  <div class="hint">Không có tài khoản? Đăng kí! </div>
</section>
{% endblock %}
